apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helpdesk.backendName" . }}
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    {{- include "helpdesk.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "helpdesk.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helpdesk.labels" . | nindent 8 }}
        {{- include "helpdesk.selectorLabels" (dict "ctx" . "component" "backend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "helpdesk.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
      initContainers:
        # Wait for PostgreSQL so the first `alembic upgrade` does not crash-loop the pod.
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ include "helpdesk.postgresName" . }} -p 5432 -U {{ .Values.postgres.username }}; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            {{- include "helpdesk.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helpdesk.postgresSecretName" . }}
                  key: database-url
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30   # allow time for migrations + Postgres to come up
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "helpdesk.containerSecurityContext" . | nindent 12 }}
