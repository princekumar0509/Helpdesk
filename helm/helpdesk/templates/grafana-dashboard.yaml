{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up automatically by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helpdesk.fullname" . }}-dashboard
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  helpdesk-api.json: |-
{{ .Files.Get "dashboards/helpdesk-api.json" | indent 4 }}
{{- end }}
