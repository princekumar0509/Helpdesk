# CI/CD for HelpDesk.
#
#   test  ──►  build + Trivy scan + push to GHCR  ──►  GitOps commit of the new tags  ──►  verify on EKS
#
# Deployment is GitOps: ArgoCD (argocd/helpdesk-application.yaml) syncs helm/helpdesk from main, so the
# pipeline only commits the new image tags. The verify job needs two repository *variables*:
#   AWS_DEPLOY_ROLE_ARN  — `terraform output github_deploy_role_arn`
#   EKS_CLUSTER_NAME     — `terraform output cluster_name`
# No AWS keys are stored anywhere: verify gets short-lived credentials through GitHub OIDC.
name: HelpDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: helpdesk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_DIR: .
  AWS_REGION: ap-south-1
  NAMESPACE: helpdesk

jobs:
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    permissions: {contents: read}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint backend (ruff)
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Run backend tests (pytest)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - name: Lint Helm chart
        run: helm lint helm/helpdesk -f helm/helpdesk/values-prod.yaml

  build-scan-push:
    name: Build, scan (Trivy) and push images
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      backend_image: ${{ steps.names.outputs.backend }}
      frontend_image: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image names (GHCR requires lowercase)
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/helpdesk-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/helpdesk-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Images are tagged with the commit SHA: every running pod traces back to an exact commit.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}/backend
          load: true
          tags: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}/frontend
          load: true
          tags: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Security gate: fail the pipeline on any fixable HIGH/CRITICAL CVE, before anything is pushed.
      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.names.outputs.backend }}:${{ github.sha }}"
          docker push "${{ steps.names.outputs.frontend }}:${{ github.sha }}"
          {
            echo "### Published images"
            echo "- \`${{ steps.names.outputs.backend }}:${{ github.sha }}\`"
            echo "- \`${{ steps.names.outputs.frontend }}:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  gitops:
    name: GitOps - commit new image tags
    needs: build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # ArgoCD watches helm/helpdesk on main. Committing the new tags *is* the deployment:
      # no cluster credentials are needed here. Pushes made with GITHUB_TOKEN don't start another run.
      - name: Point values-image.yaml at this commit's images
        run: |
          sed -i -E "s|^(    tag: ).*|\1${GITHUB_SHA}|" helm/helpdesk/values-image.yaml
          sed -i -E "0,/repository:/s|(repository: ).*|\1${{ needs.build-scan-push.outputs.backend_image }}|" helm/helpdesk/values-image.yaml
          sed -i -E "0,/frontend:/!s|(repository: ).*helpdesk-frontend|\1${{ needs.build-scan-push.outputs.frontend_image }}|" helm/helpdesk/values-image.yaml
          cat helm/helpdesk/values-image.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/helpdesk/values-image.yaml
          if git diff --cached --quiet; then echo "Tags already current"; exit 0; fi
          git commit -m "chore(gitops): deploy ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  verify:
    name: Verify ArgoCD rollout on EKS
    needs: gitops
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read, id-token: write}
    steps:
      - name: Get AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Wait until ArgoCD has rolled out this commit
        run: |
          for d in helpdesk-backend helpdesk-frontend; do
            for i in $(seq 1 60); do
              img=$(kubectl get deployment "$d" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}')
              case "$img" in *":${GITHUB_SHA}") echo "$d -> $img"; break;; esac
              [ "$i" = 60 ] && { echo "::error::$d still runs $img after 10 minutes"; exit 1; }
              sleep 10
            done
            kubectl rollout status deployment/"$d" -n "$NAMESPACE" --timeout=300s
          done
          kubectl get pods,svc,ingress,hpa -n "$NAMESPACE"
